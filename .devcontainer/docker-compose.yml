services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    env_file: secrets/devcontainer.app.env

    depends_on:
      - main_db

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    networks:
      - main-network

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    # network_mode: service:db

    # Uncomment to connect as root instead. More info: https://aka.ms/dev-containers-non-root.
    # user: root

    # Use "forwardPorts" in **devcontainer.json** to forward an app port locally. 
    # (Adding the "ports" property to this file will not forward from a Codespace.)

  main_db:
    image: postgres:14.3
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    env_file: secrets/devcontainer.db.env
    networks:
      - main-network
      
    # Add "forwardPorts": ["5432"] to **devcontainer.json** to forward PostgreSQL locally.
    # (Adding the "ports" property to this file will not forward from a Codespace.)
  
  pgadmin4:
    depends_on:
      - main_db
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN4_PORTAL_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN4_PORTAL_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
    image: dpage/pgadmin4
    networks:
      - main-network
    ports:
    - "127.0.0.1:${PGADMIN4_PORTAL_PORT}:5050"
    restart: unless-stopped
    volumes:
      - pgadmin4-data:/var/lib/pgadmin4
      - ./servers.json:/pgadmin4/servers.json

volumes:
  postgres-data:
  pgadmin4-data:

networks:
  main-network:
